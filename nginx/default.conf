server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # 打赏二维码：以后还要换，不能强制 30 天缓存
    location ^~ /assets/images/sponsor/ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Astro 静态站：/posts/xxx/ -> /posts/xxx/index.html
    # 注意 $uri/ 不能删，删了带尾斜杠的地址会全部 404
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;

    # 带 hash 的静态资源长期缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff2?|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Pagefind 搜索索引（每次构建都会变，不要长缓存）
    location /pagefind/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # 隐藏敏感文件
    location ~ /\. {
        deny all;
    }
}

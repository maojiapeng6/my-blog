# ============================================================
#  Firefly 个人博客 · 飞牛 FnOS Docker Compose
#  两个容器：
#    firefly-builder : Node 22，监控本地源码变化并自动构建
#    firefly-web     : nginx，托管构建产物（静态文件）
#
#  当前模式：本地模式(AUTO_SYNC=0)
#    - 不会去 GitHub 拉取，不会覆盖你本地改的东西
#    - 你改 /vol1/1000/docker/Firefly/src 里任何文件，最多 2 分钟自动重建
# ============================================================

services:

  # ---------- 1. 构建器（不对外暴露端口） ----------
  firefly-builder:
    # 必须用 node:22-bookworm（完整版，自带 git），不要用 -slim 版，
    # slim 版没 git，容器里临时 apt 装 git 会因国外源太慢卡死
    image: node:22-bookworm
    container_name: firefly-builder
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 0 = 本地模式：不连远端，只监控本地文件变化后重建
      # 1 = 远端为准：每 SYNC_INTERVAL 秒拉取远端并重建（本地改动会被覆盖）
      # 2 = 双向模式：本地改了自动推送，网页改了自动拉取（推荐长期用）
      #     用 2 之前，先在飞牛跑一次 github_setup.sh 把代码推上去
      AUTO_SYNC: "2"
      # 模式 1 和 2 都要填你的仓库地址
      REPO_URL: "https://github.com/maojiapeng6/my-blog.git"
      SRC: "/firefly/src"
      BRANCH: "master"
      # 检测文件变化的间隔（秒），120 = 每 2 分钟检查一次
      SYNC_INTERVAL: "120"
      # npm 国内镜像（不用改）
      NPM_REGISTRY: "https://registry.npmmirror.com"
      NODE_OPTIONS: "--max-old-space-size=4096"
    # 指定国内 DNS，避免构建时下载字体因解析慢而超时失败
    dns:
      - 223.5.5.5
      - 119.29.29.29
    volumes:
      - ./:/firefly
      - ./dist:/dist                                 # 构建产物
      - ./scripts/entrypoint.sh:/entrypoint.sh:ro    # 构建脚本
    command: ["bash", "/entrypoint.sh"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------- 2. 网站（nginx 静态托管） ----------
  firefly-web:
    image: nginx:1.27-alpine
    container_name: firefly-web
    restart: unless-stopped
    depends_on:
      - firefly-builder
    ports:
      # 博客对外端口 18080 -> 容器内 nginx 80（右边 80 不要动）
      # 注意：45678 已让给 Lucky 使用，这里刻意避开
      # 访问地址：http://飞牛内网IP:18080
      - "18080:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
